{% extends "pantry/layout.html" %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'recipes/recipes.css' %}">
{% endblock %}

{% block body %}

<div class="recipes-page">

    <a href="{% url 'index' %}" class="back-button"> ← Back to Home</a>

    <h1 class="recipes-title">Recipes</h1>


    <form method="get" class="search-form">

        <input
            type="text"
            name="search"
            value="{{ search }}"
            placeholder="Search recipes..."
            class="search-input">

        <button type="submit" class="search-button">Search</button>

    </form>


    {% if meals %}

        <div class="recipes-container">

            {% for meal in meals %}

                <a href="{% url 'recipe_detail' meal.idMeal %}" class="recipe-card">

                    <img src="{{ meal.strMealThumb }}" alt="{{ meal.strMeal }}">

                    <div class="recipe-info">

                        <h3>{{ meal.strMeal }}</h3>

                    </div>

                </a>

            {% endfor %}

        </div>

    {% else %}

        <p class="no-results">No recipes found.</p>

    {% endif %}

</div>

{% endblock %}
