{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Pantry{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'recipes/layout.css' %}">

    {% block head %}
    {% endblock %}
</head>

<body>

<header class="navbar">

    <a href="{% url 'index' %}" class="logo">Pantry</a>

    <details class="menu">
        <summary>☰</summary>

        <div class="dropdown">

            <a href="{% url 'index' %}">Home</a>

            {% if user.is_authenticated %}

                <a href="{% url 'login' %}">Logout</a>

            {% else %}

                <a href="{% url 'login' %}">Login</a>

            {% endif %}

        </div>
    </details>

</header>

{% block body %}
{% endblock %}

</body>
</html>
